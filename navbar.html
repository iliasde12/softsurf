<html lang="nl-BE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/x-icon" href="/assets/images/softsurf_logo.png" />
    <title>NAVBAR</title>
  </head>

  <body class="flex flex-col h-screen bg-[#0D0B1E] text-white overflow-hidden">
    <!-- HEADER -->
    <header class="bg-[#100E22] h-16 flex items-center px-4 w-full shrink-0 justify-between md:justify-start">
      <button class="md:hidden text-white text-xl">☰</button>
      <img src="/assets/images/softsurf_logo.png" alt="softsurf_logo" class="w-28 md:w-36 mx-auto md:mx-0" />
      <div class="md:hidden w-6"></div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- ASIDE (hidden on mobile) -->
      <aside class="hidden md:flex w-[20%] bg-[#100E22] flex-col justify-between py-4 px-4 overflow-y-auto">
        <div>
          <div class="flex items-center gap-2 mb-6">
            <div class="w-8 h-8 rounded-full bg-[#7B6BF5] flex items-center justify-center text-xs font-bold">M</div>
            <span class="font-bold text-white text-sm">MusicMatch</span>
          </div>

          <p class="text-[#6B6B8A] text-xs uppercase font-semibold mb-2 tracking-widest">Ontdekken</p>
          <nav class="flex flex-col gap-1 mb-6">
            <a href="/search.html" class="flex items-center gap-2 text-[#A0A0C0] hover:text-white text-sm py-1 px-2 rounded-lg hover:bg-[#1E1B3A] transition">
              🔍
              <span>Zoeken</span>
            </a>
            <a href="/vergelijken-artiesten.html" class="flex items-center gap-2 text-[#A0A0C0] hover:text-white text-sm py-1 px-2 rounded-lg hover:bg-[#1E1B3A] transition">
              ⚖️
              <span>Vergelijken</span>
            </a>
            <a href="/mood.html" class="flex items-center gap-2 text-[#A0A0C0] hover:text-white text-sm py-1 px-2 rounded-lg hover:bg-[#1E1B3A] transition">
              😊
              <span>Stemming</span>
            </a>
          </nav>

          <p class="text-[#6B6B8A] text-xs uppercase font-semibold mb-2 tracking-widest">Bibliotheek</p>
          <nav class="flex flex-col gap-1 mb-6">
            <a href="/collectie.html" class="flex items-center gap-2 text-white text-sm py-1 px-2 rounded-lg bg-[#7B6BF5] transition">
              🎵
              <span>Mijn Collectie</span>
            </a>
            <a href="/playlist.html" class="flex items-center gap-2 text-[#A0A0C0] hover:text-white text-sm py-1 px-2 rounded-lg hover:bg-[#1E1B3A] transition">
              🎶
              <span>Afspeellijsten</span>
            </a>
          </nav>

          <p class="text-[#6B6B8A] text-xs uppercase font-semibold mb-2 tracking-widest">Spelletjes</p>
          <nav class="flex flex-col gap-1">
            <a href="/guessthesong.html" class="flex items-center gap-2 text-[#A0A0C0] hover:text-white text-sm py-1 px-2 rounded-lg hover:bg-[#1E1B3A] transition">
              🎯
              <span>Raad het Nummer</span>
            </a>
          </nav>
        </div>

        <div class="flex items-center gap-2 border-t border-[#1E1B3A] pt-4">
          <div class="w-8 h-8 rounded-full bg-[#7B6BF5] flex items-center justify-center text-xs font-bold">S</div>
          <div>
            <p class="text-white text-sm font-semibold">Saint</p>
            <p class="text-[#7B6BF5] text-xs">● Feest-stemming</p>
          </div>
        </div>
      </aside>
    </div>
  </body>
</html>
