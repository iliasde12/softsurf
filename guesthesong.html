<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playlist</title>
    <link rel="stylesheet" href="./css/guesthesong.css" />
    <link rel="stylesheet" href="./css/general.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="grid grid-cols-4">
    <head>
      <nav class="col-span-4">
        <img src="./img/softsurf_logo.png" alt="" />
      </nav>
    </head>
    <main class="col-span-3">
      <section class="top">
        <h1
          class="font-display text-3xl font-semibold tracking-tight text-light"
        >
          Guess The Song?
        </h1>
        <p>Luister naar een korte preview en raad welk nummer het is.</p>
      </section>
      <section class="grid grid-cols-[4rem_4rem_4rem] gap-1 points">
        <p id="seven">7</p>
        <p id="twelve">12</p>
        <p id="three">3</p>
        <p class="comment">Goed</p>
        <p class="comment">Totaal</p>
        <p class="comment">Reeks</p>
      </section>
      <section class="backg-plate">
        <img id="plate" src="./img/plate.svg" alt="" />
      </section>
      <form action="#">
        <input type="text" />
        <label for="">Indienen</label>
      </form>
      <section class="flex flex-col backg-list">
        <ul>
          <li
            class="grid grid-cols-[4rem_5rem_5rem_auto] items-center justify-stretch"
          >
            <p class="cover"></p>
            <p>Last Last</p>
            <p>Burna Boy</p>
            <p></p>
          </li>
        </ul>
      </section>
    </main>
    <aside class="row-span-2 row-start-2">
      <section>
        <h2>Ontdekken</h2>
        <p>zoeken</p>
        <p>vergelijken</p>
        <p>Stemming</p>
      </section>
      <section>
        <h2>Bibliotheek</h2>
        <p>Mijn collectie</p>
        <p>Afspeellijsten</p>
      </section>
      <section>
        <h2>Spelletjes</h2>
        <p>Raad het nummer</p>
      </section>
    </aside>
    <footer class="col-span-4">
      <section class="flex flex-row">
        <h3>Last</h3>
        <p>Burna boy</p>
        <figure></figure>
      </section>
      <section class="flex flex-row">
        <p>1:22</p>
        <p>5:22</p>
      </section>
      <section>
        <h3>volume</h3>
      </section>
    </footer>
  </body>
</html>
